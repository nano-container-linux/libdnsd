name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pkgx
        run: |
          set -eux
          curl -fsSL https://pkgx.sh | sh
          # $GITHUB_ENV takes KEY=value lines, so an `export PATH=...` written
          # there defines a variable literally named "export PATH" and leaves
          # PATH untouched -- the next step then cannot find pkgx at all. The
          # directory to prepend goes in $GITHUB_PATH instead.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run tests via pkgx dev
        run: |
          set -eux
          pkgx --version
          # The module is at the repository root; there is no libdnsd/ directory
          # to cd into.
          pkgx dev -- go test ./...
