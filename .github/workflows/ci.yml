name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pkgx
        run: |
          set -eux
          curl -fsSL https://pkgx.sh | sh
          # $GITHUB_ENV takes KEY=value lines, so an `export PATH=...` written
          # there defines a variable literally named "export PATH" and leaves
          # PATH untouched -- the next step then cannot find pkgx at all. The
          # directory to prepend goes in $GITHUB_PATH instead.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run tests with a pkgx-provided Go
        run: |
          set -eux
          # Fail loudly here rather than as a missing command below.
          pkgx --version
          # `pkgx dev -- go test ./...` is not the right invocation: `dev` takes
          # a directory, so it read "go" as one and died with
          # "not a directory: .../go". `+go` asks pkgx for the Go package and
          # then runs the command. The module is at the repository root, so
          # there is no subdirectory to cd into either.
          pkgx +go -- go test ./...
